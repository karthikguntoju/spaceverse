<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Spaceverse">
  <title>Spaceverse</title>
  <!--
    LATTICE on the app tile — for anywhere the mark needs its own ground
    instead of borrowing the page's: app icon, share card, install prompt, or
    a light background where the white rows would otherwise vanish.

    Ground is #05070D, the value the app paints behind every page. Geometry is
    the small cut, inset so the mark clears the corner radius. Identical to
    /public/favicon.svg — keep the two in step.
  -->
  <rect width="100" height="100" rx="22" fill="#05070D"/>

  <g stroke-linecap="round" stroke-width="14" stroke-dasharray="0.1 16">
    <line x1="34" y1="30" x2="66" y2="30" stroke="#F2F6FF" stroke-opacity=".85"/>
    <line x1="26" y1="50" x2="74" y2="50" stroke="#22D3EE"/>
    <line x1="34" y1="70" x2="66" y2="70" stroke="#F2F6FF" stroke-opacity=".7"/>
  </g>

  <ellipse cx="50" cy="50" rx="36" ry="9.5" fill="none" stroke="#A78BFA" stroke-width="6"
           transform="rotate(-24 50 50)"/>
</svg>
