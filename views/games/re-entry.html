<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <title>Re-Entry — SpaceVerse Arcade</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Orbitron:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="/public/favicon.svg">
    <link rel="stylesheet" href="/public/css/arcade.css">
    <!-- Last in <head> on purpose: the bridge re-points this page's tokens and
         re-materials its controls as glass, and it wins on source order, not on
         specificity. The per-game accent survives it — shell.js writes --accent
         as an inline style on <html>, which outranks any stylesheet. -->
    <link rel="stylesheet" href="/public/css/liquid-glass-theme.css">
    <script src="/public/js/liquid-glass.js" defer></script>
</head>
<body class="arcade">
    <!-- The shell builds the canvas, HUD and overlays; the game file below
         supplies the rules. Both are plain scripts with no imports, so this
         page has nothing to resolve before it can start drawing. -->
    <script src="/public/js/arcade/shell.js"></script>
    <script src="/public/js/arcade/re-entry.js"></script>
</body>
</html>
