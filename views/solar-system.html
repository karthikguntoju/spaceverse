<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpaceVerse — Solar System Explorer</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Orbitron:wght@600;700;900&display=swap"
        rel="stylesheet">
    <style>
        html {
            font-size: 110%;
        }

        :root {
            --bg: #050510;
            --text: #e2e8f0;
            --gold: #00f3ff;
            --gold-dim: rgba(0, 243, 255, 0.12);
            --cyan: #00f3ff;
            --cyan-dim: rgba(0, 243, 255, 0.08);
            --glass: rgba(20, 20, 40, 0.4);
            --glass-border: rgba(0, 243, 255, 0.3);
            --radius: 17.6px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            overflow: hidden;
            font-family: 'Inter', system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
            cursor: default;
        }

        canvas {
            display: block;
        }


        /* ── TOP BAR ── */
        #topbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 90;
            height: 66px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 33px;
            background: linear-gradient(to bottom, rgba(5, 5, 16, .92), transparent);
            pointer-events: none;
        }

        #topbar>* {
            pointer-events: auto;
        }

        .logo {
            font-family: 'Orbitron', sans-serif;
            font-size: 1rem;
            font-weight: 900;
            letter-spacing: 3px;
            text-decoration: none;
            color: var(--text);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .logo b {
            color: var(--gold);
        }

        .top-actions {
            display: flex;
            gap: 10px;
        }

        .top-btn {
            padding: 8px 18px;
            border-radius: 22px;
            border: 1px solid var(--glass-border);
            border-top: 1px solid rgba(255, 255, 255, 0.3);
            background: var(--glass);
            color: var(--text);
            font-size: .75rem;
            font-weight: 600;
            cursor: pointer;
            transition: all .25s;
            backdrop-filter: blur(16px) saturate(150%);
            -webkit-backdrop-filter: blur(16px) saturate(150%);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4), inset 0 2px 10px rgba(255, 255, 255, 0.05);
            font-family: 'Inter', sans-serif;
        }

        .top-btn:hover {
            background: var(--gold-dim);
            border-color: rgba(255, 215, 0, .3);
            color: var(--gold);
        }

        /* ── PLANET NAV (bottom) ── */
        #planet-bar {
            position: fixed;
            bottom: 26px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 80;
            display: flex;
            gap: 4px;
            padding: 7px 11px;
            background: var(--glass);
            backdrop-filter: blur(16px) saturate(150%);
            -webkit-backdrop-filter: blur(16px) saturate(150%);
            border: 1px solid var(--glass-border);
            border-top: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 44px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6), inset 0 2px 10px rgba(255, 255, 255, 0.05);
        }

        .pb-item {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 8px 16px;
            border-radius: 30px;
            border: none;
            background: transparent;
            color: rgba(232, 236, 244, .55);
            font-size: .78rem;
            font-weight: 600;
            cursor: pointer;
            transition: all .3s cubic-bezier(.4, 0, .2, 1);
            font-family: 'Inter', sans-serif;
            white-space: nowrap;
        }

        .pb-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            flex-shrink: 0;
            transition: box-shadow .3s;
        }

        .pb-item:hover {
            color: var(--text);
            background: rgba(255, 255, 255, .04);
        }

        .pb-item.active {
            color: #fff;
            background: rgba(255, 215, 0, .1);
            box-shadow: 0 0 20px rgba(255, 215, 0, .08);
        }

        .pb-item.active .pb-dot {
            box-shadow: 0 0 8px 2px currentColor;
        }

        /* ── HUD CARD (left info) ── */
        #hud {
            position: fixed;
            left: 33px;
            top: 88px;
            width: 374px;
            z-index: 50;
            transform: translateX(-460px);
            opacity: 0;
            transition: all .5s cubic-bezier(.4, 0, .2, 1);
        }

        #hud.show {
            transform: translateX(0);
            opacity: 1;
        }

        .hud-card {
            background: var(--glass);
            backdrop-filter: blur(16px) saturate(150%);
            -webkit-backdrop-filter: blur(16px) saturate(150%);
            border: 1px solid var(--glass-border);
            border-top: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: var(--radius);
            padding: 31px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5), inset 0 2px 10px rgba(255, 255, 255, 0.05);
        }

        .hud-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, var(--gold), var(--cyan));
            opacity: .6;
        }

        .hud-sub {
            font-size: .6rem;
            font-weight: 700;
            letter-spacing: 5px;
            color: var(--cyan);
            text-transform: uppercase;
            margin-bottom: 4px;
        }

        .hud-name {
            font-family: 'Orbitron', sans-serif;
            font-size: 2.2rem;
            font-weight: 900;
            color: #fff;
            margin-bottom: 8px;
            line-height: 1.1;
        }

        .hud-desc {
            font-size: .85rem;
            line-height: 1.65;
            color: rgba(232, 236, 244, .6);
            margin-bottom: 20px;
        }

        .stat-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 22px;
        }

        .stat {
            background: rgba(255, 255, 255, .02);
            border-left: 2px solid var(--gold);
            padding: 10px 14px;
        }

        .stat-lbl {
            font-size: .58rem;
            font-weight: 700;
            letter-spacing: 2px;
            color: var(--gold);
            text-transform: uppercase;
            margin-bottom: 3px;
        }

        .stat-val {
            font-family: 'Orbitron', sans-serif;
            font-size: .8rem;
            color: #fff;
        }

        .hud-btns {
            display: flex;
            gap: 10px;
        }

        .btn-gold {
            flex: 1;
            padding: 12px;
            border: 1px solid var(--neon-blue);
            border-radius: 9px;
            background: transparent;
            color: var(--neon-blue);
            font-weight: 700;
            font-size: .8rem;
            cursor: pointer;
            transition: all .4s ease;
            font-family: 'Inter', sans-serif;
            position: relative;
            overflow: hidden;
            z-index: 1;
            box-shadow: 0 0 10px rgba(0, 243, 255, 0.2);
        }

        .btn-gold::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: var(--neon-blue);
            z-index: -1;
            transform: scaleX(0);
            transform-origin: left;
            transition: transform 0.4s ease;
        }

        .btn-gold:hover {
            box-shadow: 0 0 25px rgba(0, 243, 255, 0.8);
            border-color: transparent;
            color: #000;
        }

        .btn-gold:hover::before {
            transform: scaleX(1);
        }

        .btn-out {
            flex: 1;
            padding: 12px;
            border: 1px solid var(--neon-blue);
            border-radius: 9px;
            background: rgba(0, 243, 255, 0.03);
            color: var(--neon-blue);
            font-weight: 700;
            font-size: .8rem;
            cursor: pointer;
            transition: all .4s ease;
            backdrop-filter: blur(10px);
            font-family: 'Inter', sans-serif;
            position: relative;
            overflow: hidden;
            z-index: 1;
            box-shadow: 0 0 10px rgba(0, 243, 255, 0.2);
        }

        .btn-out::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: var(--neon-blue);
            z-index: -1;
            transform: scaleX(0);
            transform-origin: left;
            transition: transform 0.4s ease;
        }

        .btn-out:hover {
            background: transparent;
            border-color: transparent;
            box-shadow: 0 0 25px rgba(0, 243, 255, 0.6);
            color: #000;
        }

        .btn-out:hover::before {
            transform: scaleX(1);
        }

        .hud-close {
            position: absolute;
            top: 14px;
            right: 14px;
            background: none;
            border: none;
            color: rgba(232, 236, 244, .4);
            font-size: 18px;
            cursor: pointer;
            transition: color .2s;
        }

        .hud-close:hover {
            color: #fff;
        }

        /* ── CONTROLS (top-right compact) ── */
        #ctrl {
            position: fixed;
            top: 77px;
            right: 26px;
            z-index: 50;
            width: 209px;
        }

        .ctrl-card {
            background: var(--glass);
            backdrop-filter: blur(16px) saturate(150%);
            -webkit-backdrop-filter: blur(16px) saturate(150%);
            border: 1px solid var(--glass-border);
            border-top: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: var(--radius);
            padding: 18px;
            transition: all .3s;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5), inset 0 2px 10px rgba(255, 255, 255, 0.05);
        }

        .ctrl-row {
            margin-bottom: 14px;
        }

        .ctrl-row:last-child {
            margin-bottom: 0;
        }

        .ctrl-lbl {
            font-size: .6rem;
            font-weight: 700;
            letter-spacing: 2px;
            color: var(--gold);
            text-transform: uppercase;
            margin-bottom: 6px;
            display: block;
        }

        .ctrl-range {
            width: 100%;
            accent-color: var(--gold);
            height: 3px;
            cursor: pointer;
        }

        .ctrl-toggle {
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
        }

        .ctrl-toggle input[type=checkbox] {
            accent-color: var(--cyan);
            width: 14px;
            height: 14px;
            cursor: pointer;
        }

        /* ── VIGNETTE ── */
        #vignette {
            position: fixed;
            inset: 0;
            z-index: 4;
            background: radial-gradient(ellipse at center, transparent 35%, rgba(6, 10, 26, .7) 100%);
            pointer-events: none;
        }

        /* ── MUSIC PLAYER ── */
        #music-player {
            position: fixed;
            bottom: 88px;
            right: 24px;
            z-index: 100;
            display: flex;
            align-items: center;
            gap: 11px;
            background: var(--glass);
            backdrop-filter: blur(16px) saturate(150%);
            -webkit-backdrop-filter: blur(16px) saturate(150%);
            border: 1px solid var(--glass-border);
            border-top: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 44px;
            padding: 9px 15px 9px 11px;
            transition: all .3s cubic-bezier(.4, 0, .2, 1);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5), inset 0 2px 10px rgba(255, 255, 255, 0.05);
        }

        #music-player:hover {
            border-color: rgba(255, 215, 0, .25);
            box-shadow: 0 4px 24px rgba(255, 215, 0, .08);
        }

        #mus-btn {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--gold), #ffaa00);
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: .9rem;
            flex-shrink: 0;
            transition: transform .2s, box-shadow .2s;
        }

        #mus-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 0 16px rgba(255, 215, 0, .4);
        }

        #mus-btn.playing {
            animation: pulse-gold 2s ease-in-out infinite;
        }

        @keyframes pulse-gold {

            0%,
            100% {
                box-shadow: 0 0 8px rgba(255, 215, 0, .3)
            }

            50% {
                box-shadow: 0 0 20px rgba(255, 215, 0, .7)
            }
        }

        .mus-info {
            display: flex;
            flex-direction: column;
            gap: 1px;
        }

        .mus-title {
            font-size: .68rem;
            font-weight: 700;
            color: var(--gold);
            letter-spacing: .5px;
            white-space: nowrap;
        }

        .mus-artist {
            font-size: .6rem;
            color: rgba(232, 236, 244, .4);
        }

        #mus-vol {
            width: 55px;
            accent-color: var(--gold);
            height: 3px;
            cursor: pointer;
        }

        #mus-eq {
            display: flex;
            align-items: flex-end;
            gap: 2px;
            height: 14px;
            opacity: 0;
            transition: opacity .3s;
        }

        #mus-eq.active {
            opacity: 1;
        }

        .eq-bar {
            width: 3px;
            background: var(--gold);
            border-radius: 2px;
            animation: none;
        }

        #mus-eq.active .eq-bar:nth-child(1) {
            animation: eq 0.6s .0s ease-in-out infinite alternate;
        }

        #mus-eq.active .eq-bar:nth-child(2) {
            animation: eq 0.6s .15s ease-in-out infinite alternate;
        }

        #mus-eq.active .eq-bar:nth-child(3) {
            animation: eq 0.6s .1s ease-in-out infinite alternate;
        }

        #mus-eq.active .eq-bar:nth-child(4) {
            animation: eq 0.6s .05s ease-in-out infinite alternate;
        }

        @keyframes eq {
            from {
                height: 3px
            }

            to {
                height: 13px
            }
        }

        /* ── DETAIL MODAL ── */
        #detail {
            position: fixed;
            inset: 0;
            z-index: 500;
            opacity: 0;
            pointer-events: none;
            transition: opacity .5s;
        }

        #detail.open {
            opacity: 1;
            pointer-events: all;
        }

        #detail-bg {
            position: absolute;
            inset: 0;
            background: radial-gradient(ellipse at center, #0a1428, #030510);
        }

        #detail-stars {
            position: absolute;
            inset: 0;
            background: radial-gradient(white .6px, transparent .8px) 0 0/70px 70px, radial-gradient(white .3px, transparent .5px) 25px 25px/45px 45px;
            opacity: .1;
            pointer-events: none;
        }

        #detail-canvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
        }

        #d-header {
            position: absolute;
            top: 50px;
            left: 60px;
            z-index: 10;
        }

        .d-sub {
            color: var(--cyan);
            font-size: .7rem;
            font-weight: 700;
            letter-spacing: 5px;
            text-transform: uppercase;
            margin-bottom: 6px;
        }

        .d-name {
            font-family: 'Orbitron', sans-serif;
            font-size: 3.6rem;
            font-weight: 900;
            color: #fff;
            text-shadow: 0 0 40px rgba(255, 255, 255, .12);
            line-height: 1;
        }

        #d-facts {
            position: absolute;
            right: 60px;
            top: 50%;
            transform: translateY(-50%);
            width: 260px;
            z-index: 10;
        }

        .df-title {
            font-size: .6rem;
            font-weight: 700;
            color: var(--gold);
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 1px solid rgba(255, 215, 0, .15);
        }

        .df-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 9px;
        }

        .df-key {
            font-size: .76rem;
            color: rgba(232, 236, 244, .45);
        }

        .df-val {
            font-family: 'Orbitron', sans-serif;
            font-size: .76rem;
            color: #fff;
        }

        #d-desc {
            position: absolute;
            left: 60px;
            bottom: 60px;
            max-width: 460px;
            z-index: 10;
            font-size: 1rem;
            line-height: 1.8;
            color: rgba(232, 236, 244, .65);
        }

        #d-close {
            position: absolute;
            top: 50px;
            right: 60px;
            z-index: 20;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: rgba(255, 255, 255, .05);
            border: 1px solid var(--glass-border);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: rgba(232, 236, 244, .6);
            font-size: 1.1rem;
            transition: all .3s;
        }

        #d-close:hover {
            background: rgba(255, 255, 255, .12);
            color: #fff;
            transform: rotate(90deg);
        }

        #d-actions {
            position: absolute;
            bottom: 60px;
            right: 60px;
            display: flex;
            gap: 12px;
            z-index: 10;
        }

        #d-loading {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            font-size: .65rem;
            color: var(--cyan);
            letter-spacing: 3px;
            z-index: 20;
            animation: pls 1.5s ease-in-out infinite;
        }

        @keyframes pls {

            0%,
            100% {
                opacity: .3
            }

            50% {
                opacity: 1
            }
        }

        #d-loading.off {
            display: none;
        }

        #d-atmos {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            pointer-events: none;
            filter: blur(60px);
            opacity: .3;
            z-index: 0;
        }

        /* Responsive */
        canvas { touch-action: none; }
        @media(max-width:768px) {
            #hud {
                left: 10px;
                width: calc(100vw - 20px);
            }

            #planet-bar {
                bottom: 10px;
                left: 10px;
                right: 10px;
                transform: none;
                overflow-x: auto;
            }

            #ctrl {
                right: 10px;
                width: 160px;
            }
        }
    </style>

    <!-- ═══ Liquid Glass ═══════════════════════════════════════════════
         Loaded last on purpose: the bridge re-materials this page's own
         components as glass, and it wins on source order. -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="/public/css/liquid-glass-theme.css">
    <link rel="icon" type="image/svg+xml" href="/public/favicon.svg">
    <script src="/public/js/liquid-glass.js" defer></script>
    <link rel="stylesheet" href="/public/css/mobile.css">
    <script src="/public/js/mobile.js" defer></script>
</head>

<body>

    <!-- Top Bar -->
    <nav id="topbar">
        <a href="/" class="logo">🌌 SPACE<b>VERSE</b></a>
        <div class="top-actions">
            <button class="top-btn" onclick="location.href='/quiz'">🧠 Quiz</button>
            <button class="top-btn" onclick="location.href='/vr-solar-system'">🥽 VR</button>
            <a href="/" class="top-btn">← Home</a>
        </div>
    </nav>

    <!-- Bottom Planet Nav -->
    <div id="planet-bar"></div>

    <!-- Left Info HUD -->
    <div id="hud">
        <div class="hud-card">
            <button class="hud-close" id="hud-close">✕</button>
            <div class="hud-sub" id="h-sub"></div>
            <div class="hud-name" id="h-name"></div>
            <div class="hud-desc" id="h-desc"></div>
            <div class="stat-grid">
                <div class="stat">
                    <div class="stat-lbl">Mass</div>
                    <div class="stat-val" id="h-mass"></div>
                </div>
                <div class="stat">
                    <div class="stat-lbl">Radius</div>
                    <div class="stat-val" id="h-radius"></div>
                </div>
                <div class="stat">
                    <div class="stat-lbl">Gravity</div>
                    <div class="stat-val" id="h-gravity"></div>
                </div>
                <div class="stat">
                    <div class="stat-lbl">Atmosphere</div>
                    <div class="stat-val" id="h-atmos"></div>
                </div>
                <div class="stat">
                    <div class="stat-lbl">Day Length</div>
                    <div class="stat-val" id="h-day"></div>
                </div>
                <div class="stat">
                    <div class="stat-lbl">Year Length</div>
                    <div class="stat-val" id="h-year"></div>
                </div>
            </div>
            <div class="hud-btns">
                <button class="btn-gold" id="h-explore">🔭 EXPLORE</button>
                <button class="btn-out" id="h-quiz">🧠 QUIZ</button>
            </div>
        </div>
    </div>

    <!-- Controls -->
    <div id="ctrl">
        <div class="ctrl-card">
            <div class="ctrl-row"><span class="ctrl-lbl">Speed</span><input class="ctrl-range" type="range" id="c-speed"
                    min="0" max="5" step=".1" value="1"></div>
            <div class="ctrl-row"><span class="ctrl-lbl">Distance</span><input class="ctrl-range" type="range"
                    id="c-zoom" min="30" max="600" value="120"></div>
            <div class="ctrl-row"><label class="ctrl-toggle"><span class="ctrl-lbl" style="margin-bottom:0">Real-time
                        Orbits</span><input type="checkbox" id="c-realtime"></label></div>
            <div class="ctrl-row"><button class="btn-out" id="c-pause"
                    style="width:100%;padding:7px;font-size:.78rem;">⏸ Pause</button></div>
        </div>
    </div>

    <div id="vignette"></div>

    <!-- Dive/warp fade overlay -->
    <div id="fade-veil" style="position:fixed;inset:0;z-index:900;background:#000;opacity:1;pointer-events:none;transition:opacity 1.1s ease;"></div>

    <!-- Music Player -->
    <div id="music-player">
        <button id="mus-btn" title="Play / Pause">▶</button>
        <div class="mus-info">
            <div class="mus-title">Cornfield Chase</div>
            <div class="mus-artist">Hans Zimmer · Interstellar</div>
        </div>
        <input id="mus-vol" type="range" min="0" max="1" step=".01" value="0.5" title="Volume">
        <div id="mus-eq">
            <div class="eq-bar"></div>
            <div class="eq-bar"></div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {

            const PD = {
                sun: { sub: 'OUR STAR', desc: 'The Sun accounts for 99.86% of our system\'s mass. Its core fuses hydrogen at 15 million °C, radiating light across 8 billion km.', mass: '1.989×10³⁰ kg', radius: '696,340 km', grav: '274 m/s²', atmos: 'H / He', day: '25 days', year: '—', temp: '5,500 °C', moons: '0', color: '#ffcc33', ac: '#ff9900' },
                mercury: { sub: 'CLOSEST TO THE SUN', desc: 'Mercury swings closest to the Sun. Daytime soars to 430 °C, nights plummet to −180 °C — the most extreme daily range of any planet.', mass: '3.285×10²³ kg', radius: '2,439 km', grav: '3.7 m/s²', atmos: 'Virtually none', day: '59 days', year: '88 days', temp: '−180 to 430 °C', moons: '0', color: '#b0b0b0', ac: '#888' },
                venus: { sub: 'THE INFERNO', desc: 'Venus is shrouded in sulfuric acid clouds with a runaway greenhouse effect — hotter than Mercury at 465 °C and 92× Earth\'s surface pressure.', mass: '4.867×10²⁴ kg', radius: '6,051 km', grav: '8.87 m/s²', atmos: 'CO₂ / H₂SO₄', day: '243 days', year: '225 days', temp: '465 °C', moons: '0', color: '#e3bb76', ac: '#e8c060' },
                earth: { sub: 'THE PALE BLUE DOT', desc: 'Earth is the only confirmed harbor of life — a precious balance of liquid water, breathable atmosphere, and magnetic shielding.', mass: '5.972×10²⁴ kg', radius: '6,371 km', grav: '9.81 m/s²', atmos: 'N₂ / O₂ / Ar', day: '24 hours', year: '365.25 days', temp: '15 °C avg', moons: '1 (Moon)', color: '#2277ff', ac: '#4488ff' },
                mars: { sub: 'THE RED DESERT', desc: 'Mars hosts Olympus Mons — the tallest volcano — and Valles Marineris, a 4,000 km canyon. Ancient river beds hint at water\'s past.', mass: '6.39×10²³ kg', radius: '3,389 km', grav: '3.72 m/s²', atmos: 'CO₂', day: '24.6 hours', year: '687 days', temp: '−65 °C avg', moons: '2', color: '#e05530', ac: '#cc4422' },
                jupiter: { sub: 'KING OF GIANTS', desc: 'Jupiter is so massive all other planets combined equal a third of its mass. The Great Red Spot has raged for 350+ years.', mass: '1.898×10²⁷ kg', radius: '69,911 km', grav: '24.79 m/s²', atmos: 'H₂ / He', day: '9.9 hours', year: '12 years', temp: '−145 °C', moons: '95', color: '#d39c7e', ac: '#c08060' },
                saturn: { sub: 'LORD OF THE RINGS', desc: 'Saturn\'s rings stretch 282,000 km wide but are only 100 m thick — made of ice and rock from a destroyed moon.', mass: '5.683×10²⁶ kg', radius: '58,232 km', grav: '10.44 m/s²', atmos: 'H₂ / He', day: '10.7 hours', year: '29 years', temp: '−178 °C', moons: '146', color: '#f5d08b', ac: '#e8c070' },
                uranus: { sub: 'THE TILTED ICE GIANT', desc: 'Uranus spins on its side at 98° tilt. Its methane atmosphere gives it a distinctive pale aquamarine colour.', mass: '8.681×10²⁵ kg', radius: '25,362 km', grav: '8.69 m/s²', atmos: 'H₂ / He / CH₄', day: '17.2 hours', year: '84 years', temp: '−220 °C', moons: '28', color: '#88ddff', ac: '#66ccee' },
                neptune: { sub: 'THE WINDY GIANT', desc: 'Neptune\'s supersonic winds reach 2,100 km/h — the fastest in the solar system. Its moon Triton orbits retrograde.', mass: '1.024×10²⁶ kg', radius: '24,622 km', grav: '11.15 m/s²', atmos: 'H₂ / He / CH₄', day: '16 hours', year: '165 years', temp: '−218 °C', moons: '16', color: '#4477ee', ac: '#3366dd' }
            };

            const ORDER = ['sun', 'mercury', 'venus', 'earth', 'mars', 'jupiter', 'saturn', 'uranus', 'neptune'];
            const LOCAL_TEXTURES = { mercury: '/public/textures/mercury.jpg', venus: '/public/textures/venus.jpg', earth: '/public/textures/earth.jpg', mars: '/public/textures/mars.jpg', jupiter: '/public/textures/jupiter.jpg', saturn: '/public/textures/saturn.jpg', uranus: '/public/textures/uranus.jpg', neptune: '/public/textures/neptune.jpg' };
            const SURFACES = {
                mercury: { roughness: 1, bump: .065 },
                venus: { roughness: 1, atmosphere: '#e8ba75', haze: .10 },
                earth: { roughness: .86, atmosphere: '#4da5ff', haze: .17 },
                mars: { roughness: 1, bump: .055, atmosphere: '#bb694e', haze: .045 },
                jupiter: { roughness: 1, atmosphere: '#d6a77f', haze: .05 },
                saturn: { roughness: 1, atmosphere: '#dcc393', haze: .05 },
                uranus: { roughness: 1, atmosphere: '#87d3e2', haze: .10 },
                neptune: { roughness: 1, atmosphere: '#477ee5', haze: .13 }
            };
            const AXIAL_TILT = { mercury: .03, venus: 177.4, earth: 23.4, mars: 25.2,
                                 jupiter: 3.1, saturn: 26.7, uranus: 97.8, neptune: 28.3 };
            /* Calibrated 3D Orrery Layout — prevents solar corona from swallowing Mercury,
               keeps Mars clear of the Asteroid Belt, and adds authentic 3D orbital inclinations */
            const ORBIT_LAYOUT = {
                sun:     { radius: 16.0, distance: 0,   incline: 0.000,  speed: 0 },
                mercury: { radius: 2.35, distance: 46,  incline: 0.034,  speed: 0.022 },
                venus:   { radius: 4.10, distance: 70,  incline: -0.020, speed: 0.015 },
                earth:   { radius: 4.65, distance: 98,  incline: 0.000,  speed: 0.010 },
                mars:    { radius: 3.55, distance: 128, incline: 0.019,  speed: 0.008 },
                jupiter: { radius: 11.2, distance: 204, incline: -0.013, speed: 0.0045 },
                saturn:  { radius: 9.6,  distance: 268, incline: 0.022,  speed: 0.0032 },
                uranus:  { radius: 6.3,  distance: 328, incline: -0.015, speed: 0.0022 },
                neptune: { radius: 6.1,  distance: 382, incline: 0.018,  speed: 0.0016 }
            };

            /* ─── THREE.JS SETUP ─── */
            const W = innerWidth, H = innerHeight;
            const scene = new THREE.Scene();
            const camera = new THREE.PerspectiveCamera(60, W / H, 0.1, 5000);
            const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance', logarithmicDepthBuffer: true });
            renderer.setSize(W, H); renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
            // Shadows DISABLED — shadow maps cause grid/banding artifacts on sphere geometry
            renderer.shadowMap.enabled = false;
            renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 0.82;
            renderer.outputEncoding = THREE.sRGBEncoding; // correct GLTF color space — richer planet colors
            document.body.appendChild(renderer.domElement);

            const composer = new THREE.EffectComposer(renderer);
            composer.addPass(new THREE.RenderPass(scene, camera));
            const bloom = new THREE.UnrealBloomPass(new THREE.Vector2(W, H)); bloom.threshold = 0.85; bloom.strength = 0.34; bloom.radius = 0.42;
            composer.addPass(bloom);

            /* Loading */
            const lm = new THREE.LoadingManager();
            lm.onError = (u) => { console.warn('Load Error:', u); };
            const texLoader = new THREE.TextureLoader(lm);
            const maxAniso = renderer.capabilities.getMaxAnisotropy();
            function enhanceTex(t) {
                if (!t) return;
                t.anisotropy = maxAniso;
                t.minFilter = THREE.LinearMipMapLinearFilter;
                t.magFilter = THREE.LinearFilter;
                t.generateMipmaps = true;
                t.needsUpdate = true;
            }

            /* ─── CINEMA SHADER HELPERS (SpaceVerseShaders) ─── */
            const SVS = window.SpaceVerseShaders;

            function createSunBody(radius) {
                return SVS.buildSunGroup(THREE, radius, 128);
            }

            function addAtmosphere(group, key, center, radius, opts = {}) {
                if (!SURFACES[key]?.atmosphere) return;
                const mat = SVS.createAtmosphereMaterial(THREE, key, opts);
                const atmosphere = new THREE.Mesh(
                    new THREE.SphereGeometry(radius * 1.045, 64, 48),
                    mat
                );
                atmosphere.position.copy(center);
                group.add(atmosphere);
            }

            function addClouds(body, key, radius, loader, surfaceMat, opts = {}) {
                if (key !== 'venus' && key !== 'earth') return;
                const texture = loader.load(
                    key === 'venus' ? '/public/textures/venus-clouds.jpg' : '/public/textures/earth-clouds.png',
                    loaded => {
                        enhanceTex(loaded);
                        if (surfaceMat && surfaceMat.uniforms && key === 'earth') {
                            surfaceMat.uniforms.uCloudMap.value = loaded;
                            surfaceMat.uniforms.uHasClouds.value = 1.0;
                        }
                    }
                );
                const material = SVS.createCloudMaterial(THREE, key, texture, opts);
                const clouds = new THREE.Mesh(new THREE.SphereGeometry(radius * 1.015, 72, 72), material);
                body.add(clouds);
                body.userData.clouds = clouds;
            }

            /* Lighting — calibrated for deep-space terminator contrast and moons */
            scene.add(new THREE.AmbientLight(0x1b2436, 0.16));
            const sunLight = new THREE.PointLight(0xfff6e5, 2.2, 4500);
            scene.add(sunLight);

            /* Deep-Space Milky Way Panorama + Multi-Spectral Starfield */
            texLoader.load('/public/textures/star-map.jpg', skyTex => {
                skyTex.encoding = THREE.sRGBEncoding;
                enhanceTex(skyTex);
                const skySphere = new THREE.Mesh(
                    new THREE.SphereGeometry(4200, 64, 48),
                    new THREE.MeshBasicMaterial({
                        map: skyTex,
                        side: THREE.BackSide,
                        transparent: true,
                        opacity: 0.28,
                        depthWrite: false
                    })
                );
                scene.add(skySphere);
            });
            const starField = SVS.createStarfield(THREE, 28000, 4000);
            scene.add(starField);

            /* ─── STATE ─── */
            const objs = new Map();
            const moonSystems = [];
            let asteroidBelt = null;
            let sunBody = null;
            let speed = 1, isPaused = false, dragging = false, canClick = true, dragMode = null, panStart = null, prev = { x: 0, y: 0 };
            const ray = new THREE.Raycaster(), mse = new THREE.Vector2();
            // Default: zoom=120, phi=π/3 (55° tilt shows orbital depth)
            // Camera starts FAR OUT for the cinematic warp-in arrival
            const wantWarp = new URLSearchParams(location.search).get('warp') === '1';
            const START_R = wantWarp ? 2400 : 1000;
            let camTarget = new THREE.Vector3(), camR = START_R, camT = 0, camP = Math.PI / 2.5;
            let dTarget = camTarget.clone(), dR = START_R, dT = 0, dP = Math.PI / 2.5;
            let selKey = null;

            /* ─── WARP-IN INTRO (Dribbble-style cinematic arrival) ─── */
            function warpIntro() {
                const veil = document.getElementById('fade-veil');
                requestAnimationFrame(() => { veil.style.opacity = '0'; });
                camera.fov = wantWarp ? 96 : 78;
                camera.updateProjectionMatrix();
                bloom.strength = wantWarp ? 1.6 : 1.0;
                new TWEEN.Tween({ r: dR, p: dP, t: dT, fov: camera.fov, bl: bloom.strength })
                    .to({ r: 120, p: Math.PI / 3, t: 0.6, fov: 60, bl: 0.3 }, wantWarp ? 3400 : 2600)
                    .easing(TWEEN.Easing.Cubic.InOut)
                    .onUpdate(v => {
                        dR = v.r; dP = v.p; dT = v.t;
                        camera.fov = v.fov; camera.updateProjectionMatrix();
                        bloom.strength = v.bl;
                        document.getElementById('c-zoom').value = Math.round(Math.min(600, v.r));
                    })
                    .start();
            }
            warpIntro();

            /* ─── DIVE-INTO-PLANET TRANSITION (camera plunges into atmosphere) ─── */
            let diving = false;
            function diveInto(k) {
                if (diving) return;
                const o = objs.get(k);
                if (!o) { location.href = '/planet?id=' + k; return; }
                diving = true;
                const veil = document.getElementById('fade-veil');
                const rad = Math.max(1.4, (o.group.userData.radius || 1) * 1.15);
                const s0 = dTarget.clone();
                const tp = new THREE.Vector3();
                new TWEEN.Tween({ p: 0 })
                    .to({ p: 1 }, 1500)
                    .easing(TWEEN.Easing.Cubic.InOut)
                    .onUpdate(v => { o.group.getWorldPosition(tp); dTarget.lerpVectors(s0, tp, v.p); })
                    .start();
                new TWEEN.Tween({ r: dR }).to({ r: rad }, 1700).easing(TWEEN.Easing.Cubic.In).onUpdate(v => { dR = v.r; }).start();
                new TWEEN.Tween({ f: camera.fov }).to({ f: 84 }, 1700).easing(TWEEN.Easing.Cubic.In)
                    .onUpdate(v => { camera.fov = v.f; camera.updateProjectionMatrix(); }).start();
                setTimeout(() => { veil.style.transition = 'opacity .55s ease'; veil.style.opacity = '1'; }, 1150);
                setTimeout(() => { location.href = '/planet?id=' + k; }, 1800);
            }

            // Detail
            let dScn, dCam, dRen, dPlanet, dAnim, dOpen = false, detailSunBody = null;

            /* ─── SOLAR BLOOM HELPER (Sun Only — no blurry 2D blobs on planets) ─── */
            function makeGlowCanvas(color) {
                const sz = 256; const c = document.createElement('canvas'); c.width = sz; c.height = sz;
                const ctx = c.getContext('2d');
                const g = ctx.createRadialGradient(sz / 2, sz / 2, 0, sz / 2, sz / 2, sz / 2);
                g.addColorStop(0, color.replace(')', ',0.45)').replace('rgb', 'rgba'));
                g.addColorStop(0.32, color.replace(')', ',0.14)').replace('rgb', 'rgba'));
                g.addColorStop(1, 'rgba(0,0,0,0)');
                ctx.fillStyle = g; ctx.fillRect(0, 0, sz, sz);
                return c;
            }
            function hexToRgb(hex) {
                if (hex.length === 4) {
                    hex = '#' + hex[1] + hex[1] + hex[2] + hex[2] + hex[3] + hex[3];
                }
                const r = parseInt(hex.slice(1, 3), 16), g = parseInt(hex.slice(3, 5), 16), b = parseInt(hex.slice(5, 7), 16);
                return `rgb(${r},${g},${b})`;
            }
            function addSunFlare(group, pivot) {
                try {
                    const col = hexToRgb(PD.sun.ac || '#ff9900');
                    const tex = new THREE.CanvasTexture(makeGlowCanvas(col));
                    const size = Math.max(95, (group.userData?.radius || 20) * 4.2);
                    const mat = new THREE.SpriteMaterial({ map: tex, blending: THREE.AdditiveBlending, depthWrite: false, transparent: true, opacity: 0.52 });
                    const sprite = new THREE.Sprite(mat); sprite.scale.set(size, size, 1);
                    pivot.add(sprite);
                } catch (e) { console.warn('Sun flare fail:', e); }
            }

            /* ─── MAJOR MOONS & ASTEROID BELT ─── */
            const MOONS_CONFIG = {
                earth: [
                    { name: 'Moon', rScale: 0.27, distScale: 2.35, speed: 0.022, tex: '/public/textures/moon.jpg', color: '#c8c4bc', tilt: 0.09 }
                ],
                mars: [
                    { name: 'Phobos', rScale: 0.11, distScale: 1.65, speed: 0.048, color: '#9a8b7c', tilt: 0.05 },
                    { name: 'Deimos', rScale: 0.08, distScale: 2.25, speed: 0.030, color: '#afa294', tilt: -0.08 }
                ],
                jupiter: [
                    { name: 'Io', rScale: 0.11, distScale: 1.48, speed: 0.036, color: '#f2cf66', tilt: 0.03 },
                    { name: 'Europa', rScale: 0.095, distScale: 1.82, speed: 0.026, color: '#e6dfd0', tilt: -0.04 },
                    { name: 'Ganymede', rScale: 0.14, distScale: 2.22, speed: 0.018, color: '#a89a88', tilt: 0.05 },
                    { name: 'Callisto', rScale: 0.125, distScale: 2.68, speed: 0.012, color: '#7d7266', tilt: -0.03 }
                ],
                saturn: [
                    { name: 'Enceladus', rScale: 0.08, distScale: 2.52, speed: 0.032, color: '#f2f8ff', tilt: 0.04 },
                    { name: 'Titan', rScale: 0.15, distScale: 3.05, speed: 0.016, color: '#e2a648', tilt: -0.06, atmo: '#ffae52' }
                ],
                uranus: [
                    { name: 'Titania', rScale: 0.12, distScale: 2.25, speed: 0.022, color: '#c4beb8', tilt: 0.08 },
                    { name: 'Oberon', rScale: 0.11, distScale: 2.72, speed: 0.016, color: '#a89f96', tilt: -0.06 }
                ],
                neptune: [
                    { name: 'Triton', rScale: 0.14, distScale: 2.28, speed: -0.021, color: '#e6d6cf', tilt: 0.26 }
                ]
            };

            function addMoonsToPlanet(holder, key, radius) {
                const list = MOONS_CONFIG[key];
                if (!list) return;
                list.forEach((m, idx) => {
                    const moonPivot = new THREE.Group();
                    moonPivot.rotation.z = m.tilt || 0;
                    moonPivot.rotation.y = (idx * 2.1) + 0.7;
                    const mRadius = Math.max(0.18, radius * m.rScale);
                    const mDist = radius * m.distScale;

                    let mMat;
                    if (m.tex) {
                        const mTex = texLoader.load(m.tex, t => { enhanceTex(t); });
                        mMat = SVS.createPlanetSurfaceMaterial(THREE, 'moon', { map: mTex, usePointLight: true });
                    } else {
                        mMat = SVS.createPlanetSurfaceMaterial(THREE, 'moon', { baseColor: m.color, usePointLight: true, bumpScale: 0.9 });
                    }
                    const mMesh = new THREE.Mesh(new THREE.SphereGeometry(mRadius, 36, 28), mMat);
                    mMesh.position.x = mDist;
                    moonPivot.add(mMesh);

                    if (m.atmo) {
                        const hazeMat = SVS.createAtmosphereMaterial(THREE, 'venus', { color: m.atmo, intensity: 0.55, usePointLight: true });
                        const haze = new THREE.Mesh(new THREE.SphereGeometry(mRadius * 1.12, 24, 18), hazeMat);
                        haze.position.x = mDist;
                        moonPivot.add(haze);
                    }

                    holder.add(moonPivot);
                    moonSystems.push({ pivot: moonPivot, mesh: mMesh, speed: m.speed });
                });
            }

            function buildAsteroidBelt() {
                const count = 1600;
                const geo = new THREE.IcosahedronGeometry(1, 1);
                const pos = geo.attributes.position;
                const v = new THREE.Vector3();
                for (let i = 0; i < pos.count; i++) {
                    v.fromBufferAttribute(pos, i);
                    const n = 0.68 + 0.42 * Math.abs(Math.sin(1.9 + v.x * 3.1 + v.y * 2.3 + v.z * 1.7));
                    v.multiplyScalar(n);
                    pos.setXYZ(i, v.x, v.y, v.z);
                }
                geo.computeVertexNormals();
                const mat = new THREE.MeshStandardMaterial({ color: 0x8d8175, roughness: 0.94, metalness: 0.06, flatShading: true });
                const inst = new THREE.InstancedMesh(geo, mat, count);
                const dummy = new THREE.Object3D();
                const col = new THREE.Color();
                const palette = [0x7a6e63, 0x8f8274, 0x665d54, 0x9b8d7e];
                for (let i = 0; i < count; i++) {
                    const r = 152 + Math.random() * 24;
                    const a = Math.random() * Math.PI * 2;
                    const y = (Math.random() - 0.5) * 5.6;
                    const s = 0.08 + Math.pow(Math.random(), 2.2) * 0.36;
                    dummy.position.set(Math.cos(a) * r, y, Math.sin(a) * r);
                    dummy.rotation.set(Math.random() * 6, Math.random() * 6, Math.random() * 6);
                    dummy.scale.setScalar(s);
                    dummy.updateMatrix();
                    inst.setMatrixAt(i, dummy.matrix);
                    col.setHex(palette[i % palette.length]);
                    if (inst.setColorAt) inst.setColorAt(i, col);
                }
                inst.instanceMatrix.needsUpdate = true;
                if (inst.instanceColor) inst.instanceColor.needsUpdate = true;
                scene.add(inst);
                asteroidBelt = inst;
            }

            /* ─── BUILD ─── */
            fetch('/api/planets').then(r => r.json()).then(data => {
                const m = {}; data.forEach(p => m[p.key] = p);
                const arr = ORDER.map(k => m[k]).filter(Boolean);
                data.filter(p => !ORDER.includes(p.key)).forEach(p => arr.push(p));
                buildAll(arr);
                buildAsteroidBelt();
            }).catch(() => { document.querySelector('.ld-sub').textContent = 'FAILED TO LOAD'; });

            function buildAll(arr) {
                const bar = document.getElementById('planet-bar');
                arr.forEach((d, idx) => {
                    const key = d.key, pd = PD[key] || {};
                    const lay = ORBIT_LAYOUT[key];
                    if (lay) {
                        d.radius = lay.radius;
                        d.distance = lay.distance;
                        if (lay.speed) d.speed = lay.speed;
                    }
                    const orbitPlane = new THREE.Group();
                    if (lay && lay.incline) {
                        orbitPlane.rotation.z = lay.incline;
                        orbitPlane.rotation.x = lay.incline * 0.45;
                    }
                    scene.add(orbitPlane);

                    let orbit;
                    if (d.distance) {
                        orbit = SVS.createOrbitRing(THREE, d.distance, pd.ac || pd.color || '#7aa8ff', { opacity: 0.34 });
                        orbitPlane.add(orbit);
                    }
                    const pivot = new THREE.Object3D();
                    // Distribute initial orbital angles so planets form a rich 3D composition
                    if (d.distance) {
                        pivot.rotation.y = idx * 0.85;

                function play(type, opts = {}) {
                    try {
                        const c = getCtx();
                        const osc = c.createOscillator(), gain = c.createGain();
                        osc.connect(gain); gain.connect(c.destination);
                        osc.type = opts.wave || 'sine';

            /* ─── ANIMATION ─── */
            function animate() {
                requestAnimationFrame(animate);
                const now = Date.now();
                const tSec = performance.now() * 0.001;
                const daysSinceJ2000 = (now - J2000) / (86400000);
                if (starField && starField.material.uniforms) {
                    starField.material.uniforms.uTime.value = tSec;
                }
                if (!isPaused) {
                    if (sunBody && sunBody.group.userData.updateSun) {
                        sunBody.group.userData.updateSun(tSec);
                        sunBody.coreMesh.rotation.y += 0.0009 * speed;
                    }
                    objs.forEach(({ group, orbit, pivot }) => {
                        const d = group.userData; if (!d) return;
                        if (pivot && d.distance) {
                            if (useRealTime && PERIODS[d.key]) {
                                pivot.rotation.y = ((daysSinceJ2000 % PERIODS[d.key]) / PERIODS[d.key]) * Math.PI * 2;
                            } else {
                                pivot.rotation.y += (d.speed || 0.01) * speed * 0.04;
                            }
                            if (orbit && orbit.material.uniforms) {
                                orbit.material.uniforms.uPlanetAngle.value = pivot.rotation.y;
                            }
                        }
                        const spinner = d.spinner || group;
                        if (spinner && spinner.rotation) spinner.rotation.y += (d.rotationSpeed || 0.003) * speed;
                        if (d.surfaceMat && d.surfaceMat.uniforms) d.surfaceMat.uniforms.uTime.value = tSec;
                        if (d.aurora && d.aurora.material.uniforms) d.aurora.material.uniforms.uTime.value = tSec;
                        if (d.clouds) {
                            d.clouds.rotation.y += ((d.rotationSpeed || 0.003) + (d.key === 'venus' ? -.0012 : .0006)) * speed;
                            if (d.clouds.material.uniforms) d.clouds.material.uniforms.uTime.value = tSec;
                        }
                    });
                    for (let i = 0; i < moonSystems.length; i++) {
                        const m = moonSystems[i];
                        m.pivot.rotation.y += m.speed * speed * 0.6;
                        m.mesh.rotation.y += 0.004 * speed;
                    }
                    if (asteroidBelt) {
                        asteroidBelt.rotation.y += 0.00025 * speed;
                    }
                }
                if (!dragging && !diving) dT += 0.00009;   // slow idle orbital drift
                camTarget.lerp(dTarget, .12);
                camR = THREE.MathUtils.lerp(camR, dR, .12);
                camT = THREE.MathUtils.lerp(camT, dT, .12);
                camP = THREE.MathUtils.lerp(camP, dP, .12);
                camera.position.set(camTarget.x + camR * Math.sin(camP) * Math.sin(camT), camTarget.y + camR * Math.cos(camP), camTarget.z + camR * Math.sin(camP) * Math.cos(camT));
                camera.lookAt(camTarget);
                TWEEN.update();
                composer.render();
            }
            animate();

            window.addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); composer.setSize(innerWidth, innerHeight); });
        });
    </script>
    <script src="/public/js/chat-widget.js" defer></script>
</body>
